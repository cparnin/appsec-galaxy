name: 'AppSec Galaxy Scan'
description: 'AI-powered application security scanning with cross-file attack-chain analysis'
author: 'AppSec Galaxy Contributors'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  ai-provider:
    description: "AI provider: 'anthropic' (default) or 'openai'"
    required: false
    default: 'anthropic'
  openai-api-key:
    description: 'OpenAI API key used by AI scanning and remediation (AI_PROVIDER=openai)'
    required: false
  anthropic-api-key:
    description: 'Anthropic API key used by AI scanning and remediation (AI_PROVIDER=anthropic)'
    required: false
  ai-model:
    description: 'Optional model override; defaults to the selected scan depth for the provider'
    required: false
    default: ''
  auto-fix:
    description: 'Enable automatic remediation and PR creation'
    required: false
    default: 'true'
  auto-fix-mode:
    description: 'Specific auto-fix mode: 1=SAST+secrets, 2=dependencies, 3=both, 4=skip (overrides auto-fix if set)'
    required: false
    default: ''
  fail-on-critical:
    description: 'Fail the workflow if critical vulnerabilities are found'
    required: false
    default: 'false'
  scan-level:
    description: 'Scan level: critical-high or all'
    required: false
    default: 'critical-high'
  code-quality:
    description: 'Enable code quality and maintainability scanning (in addition to security)'
    required: false
    default: 'true'
  dependency-analysis:
    description: 'Enable dependency code-path analysis (traces usage, health, depth)'
    required: false
    default: 'true'
  ai-scan:
    description: 'Enable AI-native deep analysis for logic errors, auth bypasses, and race conditions'
    required: false
    default: 'false'
  ai-scan-depth:
    description: 'AI scan depth: quick, standard, or deep'
    required: false
    default: 'standard'
  ai-scan-tier:
    description: 'AI data privacy tier: 1 = no AI calls, 2 = finding metadata only (no source code), 3 = full source files (default). Tiers 1 and 2 disable AI deep analysis and AI code fixes.'
    required: false
    default: '3'
  ai-scan-max-cost:
    description: 'Hard USD ceiling for every AI call in the run (scanner, cross-file, auto-fix) (e.g. "1.00"); the scan stops issuing AI calls at the cap. Empty = no cap.'
    required: false
    default: ''

outputs:
  total-findings:
    description: 'Total number of security findings'
  critical-findings:
    description: 'Number of critical severity findings'
  high-findings:
    description: 'Number of high severity findings'
  secrets-found:
    description: 'Number of secrets detected'
  report-path:
    description: 'Path to the generated security report'
  sbom-generated:
    description: 'Whether SBOM was successfully generated (true/false)'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade -r ${{ github.action_path }}/requirements.txt
        python -m pip install --no-deps ${{ github.action_path }}

    - name: Setup Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.2.6 (post-incident safe version)
      with:
        version: v0.72.0  # pinned; bump deliberately (v0.69.4 was a malicious release, never auto-latest)

    - name: Setup Gitleaks
      uses: gacts/gitleaks@c9a0338361dc45a01aa7ebaaa5330179f3c62873  # v1.3.2
      with:
        version: 8.30.1  # pinned; matches self-scan.yml (supply-chain hygiene)
        run: false  # Just install, don't run yet

    - name: Setup Syft for SBOM generation
      # Pinned action instead of curl | sh: piping a fetched script straight
      # to a shell runs whatever the server returns, with no pinning of the
      # executed bytes. The SHA-pinned action matches how every other setup
      # step here is hardened.
      uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
      with:
        syft-version: v1.46.0

    - name: Setup Node.js for dependency fixes
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'  # 18 is EOL; current ESLint requires >=20

    - name: Install code quality linters
      shell: bash
      # Pylint + ESLint cover the most common client stacks. Other linters
      # (rubocop, golangci-lint, ...) run only if already on the runner;
      # AppSec Galaxy gracefully skips missing ones.
      # Major versions pinned: an unpinned major bump changes the JSON output
      # shape, which the parsers treat as "no findings" -- a silent loss of
      # code-quality coverage rather than a visible failure.
      run: |
        pip install 'pylint>=3,<4'
        npm install -g 'eslint@^9'
        
    - name: Setup Go for dependency fixes
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: '1.21'
        
    - name: Setup Java for dependency fixes
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Rust for dependency fixes
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      
    - name: Setup PHP for dependency fixes
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
      with:
        php-version: '8.2'
        tools: composer
        
    - name: Configure Git for auto-remediation
      shell: bash
      run: |
        git config --global user.email "appsec-galaxy@users.noreply.github.com"
        git config --global user.name "AppSec Galaxy"

    - name: Run AppSec Galaxy
      shell: bash
      env:
        AI_PROVIDER: ${{ inputs.ai-provider }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        AI_MODEL: ${{ inputs.ai-model }}
        # Force auto-fix off on FORK pull requests (head repo differs from the
        # repo running the workflow): that checkout is code from someone
        # outside the repo, and remediation commits/pushes/opens a PR.
        # Same-repo PRs, push, and workflow_dispatch honor the input. The
        # scanner also enforces this internally (is_untrusted_pr_context); this
        # is the outer layer so the fork branch is never even a candidate.
        APPSEC_AUTO_FIX: ${{ (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository) && 'false' || inputs.auto-fix }}
        APPSEC_AUTO_FIX_MODE: ${{ (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository) && '4' || inputs.auto-fix-mode }}
        APPSEC_SCAN_LEVEL: ${{ inputs.scan-level }}
        APPSEC_CODE_QUALITY: ${{ inputs.code-quality }}
        APPSEC_DEPENDENCY_ANALYSIS: ${{ inputs.dependency-analysis }}
        APPSEC_AI_SCAN: ${{ inputs.ai-scan }}
        APPSEC_AI_SCAN_DEPTH: ${{ inputs.ai-scan-depth }}
        APPSEC_AI_SCAN_TIER: ${{ inputs.ai-scan-tier }}
        APPSEC_AI_SCAN_MAX_COST: ${{ inputs.ai-scan-max-cost }}
        # APPSEC_DEBUG / APPSEC_LOG_LEVEL are deliberately NOT set here so a
        # caller's `env:` on the step can enable them (step env would win).
      run: |
        cd ${{ github.action_path }}
        python -m appsec_galaxy.main
        
    - name: Set outputs
      shell: bash
      run: |
        set -euo pipefail
        cd ${{ github.action_path }}

        # AppSec Galaxy writes outputs/<repo_name>/raw/; the old flat outputs/raw/
        # never exists, which made every count silently report 0.
        raw_dir=$(ls -d outputs/*/raw 2>/dev/null | head -1 || true)
        raw_dir=${raw_dir:-outputs/raw}

        semgrep_file="$raw_dir/semgrep.json"
        gitleaks_file="$raw_dir/gitleaks.json"
        trivy_file="$raw_dir/trivy-sca.json"

        if [ -f "$semgrep_file" ]; then
          critical_count=$(jq '[.results[]? | (.extra.severity? // .severity? // "") | ascii_downcase | select(. == "critical")] | length' "$semgrep_file" 2>/dev/null || echo "0")
          high_count=$(jq '[.results[]? | (.extra.severity? // .severity? // "") | ascii_downcase | select(. == "high" or . == "error")] | length' "$semgrep_file" 2>/dev/null || echo "0")
          total_sast=$((critical_count + high_count))
        else
          critical_count=0
          high_count=0
          total_sast=0
        fi

        if [ -f "$gitleaks_file" ]; then
          secrets_count=$(jq 'length' "$gitleaks_file" 2>/dev/null || echo "0")
        else
          secrets_count=0
        fi

        if [ -f "$trivy_file" ]; then
          # Dependency CVEs and IaC misconfigurations (both live in Results[]),
          # counted per severity so critical CVEs reach critical-findings.
          trivy_critical=$(jq '[.Results[]? | (.Vulnerabilities[]?, .Misconfigurations[]?) | (.Severity // "") | ascii_downcase | select(. == "critical")] | length' "$trivy_file" 2>/dev/null || echo "0")
          trivy_high=$(jq '[.Results[]? | (.Vulnerabilities[]?, .Misconfigurations[]?) | (.Severity // "") | ascii_downcase | select(. == "high")] | length' "$trivy_file" 2>/dev/null || echo "0")
        else
          trivy_critical=0
          trivy_high=0
        fi

        critical_count=$((critical_count + trivy_critical))
        high_count=$((high_count + trivy_high))
        total_findings=$((total_sast + secrets_count + trivy_critical + trivy_high))

        {
          echo "total-findings=$total_findings"
          echo "critical-findings=$critical_count"
          echo "high-findings=$high_count"
          echo "secrets-found=$secrets_count"
          echo "report-path=${{ github.action_path }}/outputs/"
          sbom_dir="$(dirname "$raw_dir")/sbom"
          if [ -f "$sbom_dir/sbom.cyclonedx.json" ] || [ -f "$sbom_dir/sbom.spdx.json" ]; then
            echo "sbom-generated=true"
          else
            echo "sbom-generated=false"
          fi
        } >> "$GITHUB_OUTPUT"
        
    - name: Check security gate
      shell: bash
      if: inputs.fail-on-critical == 'true'
      run: |
        # Delegate to the tested gate script: resolves the repo-namespaced
        # output layout and honors .appsec-galaxy-ignore baselines in the scanned repo.
        cd ${{ github.action_path }}
        python scripts/fail_on_critical.py
        
    - name: Upload Security Reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: always()
      with:
        name: security-reports
        # raw/gitleaks.json carries plaintext secret values; never publish it
        # as a downloadable artifact.
        path: |
          ${{ github.action_path }}/outputs/
          !${{ github.action_path }}/outputs/**/raw/gitleaks.json
        retention-days: 30
