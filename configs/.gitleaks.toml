title = "AppSec Galaxy Secrets Rules"

gitignore = true

# Inherit the upstream gitleaks ruleset (150+ maintained provider rules) and
# layer the custom rules below on top. Without this, detection is frozen at
# whatever formats were hand-written here: any credential prefix a provider
# introduces or rotates from now on would be silently undetectable. The
# custom rules stay because they cover shapes the defaults do not.
[extend]
useDefault = true

[allowlist]
paths = [
  '''\.venv/''',
  '''env/''',
  '''\.git/''',
  '''__pycache__/''',
  # Gitleaks's own ignore file: fingerprint strings inside it look like
  # generic secrets to the regex rules. Customer repos may have their
  # own .gitleaksignore for the same reason.
  '''\.gitleaksignore$''',
  # Gitleaks config files: the rule regexes match themselves.
  '''\.gitleaks\.toml$''',
]
# Run allowlist regexes against the full match: these rules capture the
# keyword (e.g. API_KEY) as the secret group, not the value.
regexTarget = "match"
regexes = [
  # Documentation placeholders ("your-openai-api-key-here" etc.) are never
  # real secrets, in any repository.
  '''(?i)["']your-[a-z0-9-]+-here["']''',
]

# Override of the upstream rule of the same id. Upstream's regex accepts a
# bare 40-hex string as a Sourcegraph token whenever the file mentions
# "sourcegraph", so any SBOM, lockfile, or commit list with SHA-1 hashes
# produces hundreds of false positives (610 on one repo's git history).
# Same id so the upstream rule is replaced, not duplicated; the real
# token shapes (sgp_ prefix) are still detected.
[[rules]]
id = "sourcegraph-access-token"
description = "Sourcegraph access token"
regex = '''(?i)\b(sgp_(?:[a-fA-F0-9]{16}|local)_[a-fA-F0-9]{40}|sgp_[a-fA-F0-9]{40})\b'''
keywords = ["sgp_"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "key", "generic"]

[[rules]]
id = "github-token"
description = "GitHub Token"
regex = '''ghp_[A-Za-z0-9]{36,}'''
tags = ["github", "token", "generic"]

[[rules]]
id = "slack-webhook"
description = "Slack Webhook"
regex = '''https://hooks\.slack\.com/services/[A-Z0-9]+/[A-Z0-9]+/[A-Za-z0-9]+'''
tags = ["slack", "webhook", "generic"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN PRIVATE KEY-----[\s\S]+?-----END PRIVATE KEY-----'''
tags = ["private", "key", "generic"]

[[rules]]
id = "hardcoded-password"
description = "Hardcoded Password"
regex = '''(?i)(password|HARDCODED_PASSWORD)\s*=\s*["'][^"']{6,}["']'''
tags = ["password", "generic"]

[[rules]]
id = "generic-secret"
description = "Generic Secret/Key"
regex = '''(?i)(secret|api[_-]?key)\s*=\s*["'][^"']{6,}["']'''
tags = ["secret", "key", "generic"]

[[rules]]
id = "mysql-password"
description = "MySQL Password"
regex = '''(?i)(mysql.*(password|pwd))\s*=\s*["'][^"']{6,}["']'''
tags = ["mysql", "db", "password"]

[[rules]]
id = "postgres-password"
description = "Postgres Password"
regex = '''(?i)(postgres.*(password|pwd))\s*=\s*["'][^"']{6,}["']'''
tags = ["postgres", "db", "password"]

[[rules]]
id = "mongodb-uri"
description = "MongoDB URI"
regex = '''mongodb(\+srv)?:\/\/[^:]+:[^@]+@[^\/]+'''
tags = ["mongodb", "db", "uri"]

[[rules]]
id = "salesforce-token"
description = "Salesforce Token"
regex = '''(?i)(salesforce.*(token|key|secret))\s*=\s*["'][^"']{6,}["']'''
tags = ["salesforce", "token", "secret"]

[[rules]]
id = "google-api-key"
description = "Google API Key"
regex = '''AIza[0-9A-Za-z\\-_]{35}'''
tags = ["google", "api", "key"]

[[rules]]
id = "gcp-service-account"
description = "GCP Service Account"
regex = '''\"type\": \"service_account\"'''
tags = ["gcp", "service_account", "json"]

[[rules]]
id = "azure-client-secret"
description = "Azure Client Secret"
regex = '''(?i)(azure.*(client|app).*(secret|key))\s*=\s*["'][^"']{6,}["']'''
tags = ["azure", "client", "secret"]

[[rules]]
id = "jwt-secret"
description = "JWT Secret"
regex = '''(?i)(jwt.*secret)\s*=\s*["'][^"']{6,}["']'''
tags = ["jwt", "secret"]

[[rules]]
id = "stripe-api-key"
description = "Stripe API Key"
regex = '''sk_live_[0-9a-zA-Z]{24}'''
tags = ["stripe", "api", "key"]

[[rules]]
id = "twilio-api-key"
description = "Twilio API Key"
regex = '''SK[0-9a-fA-F]{32}'''
tags = ["twilio", "api", "key"]

[[rules]]
id = "sendgrid-api-key"
description = "SendGrid API Key"
regex = '''SG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}'''
tags = ["sendgrid", "api", "key"]

[[rules]]
id = "pem-private-key"
description = "PEM Private Key"
regex = '''-----BEGIN (RSA |DSA |EC |)PRIVATE KEY-----[\s\S]+?-----END (RSA |DSA |EC |)PRIVATE KEY-----'''
tags = ["pem", "private", "key"]

[[rules]]
id = "oauth-client-secret"
description = "OAuth Client Secret"
regex = '''(?i)(oauth.*client.*secret)\s*=\s*["'][^"']{6,}["']'''
tags = ["oauth", "client", "secret"]

[[rules]]
id = "generic-token"
description = "Generic Token"
regex = '''(?i)(token|sessionid|auth[_-]?token)\s*=\s*["'][^"']{8,}["']'''
tags = ["token", "generic"] 
