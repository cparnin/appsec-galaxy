name: Self-Scan

# AppSec Galaxy scanning itself, dogfood-style.
# Rule-based scanners run on every push/PR (free, no AI/API calls).
# The AI deep scan is deliberately disabled here: no scheduled runs, no
# provider keys in this workflow, zero API spend. Auto-remediation is
# OFF (scan-only Mode 4) so this job can never open PRs against
# ourselves. SARIF goes to the Security tab via upload-sarif (free on
# public repos) and is also in the uploaded artifact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-scan:
    name: appsec-galaxy self-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload-sarif to the Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans git history

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies (includes semgrep)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --no-deps .

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.2.6 (post-incident safe version)
        with:
          version: v0.72.0  # pinned; bump deliberately (v0.69.4 was a malicious release, never auto-latest)

      - name: Setup Gitleaks
        uses: gacts/gitleaks@c9a0338361dc45a01aa7ebaaa5330179f3c62873  # v1.3.2
        with:
          version: 8.30.1  # pinned; matches action.yml (supply-chain hygiene)
          run: false  # Just install, don't run yet

      - name: Run AppSec Galaxy scan (scan-only, no auto-fix)
        env:
          APPSEC_SCAN_LEVEL: critical-high
          APPSEC_AUTO_FIX: "false"          # no PRs from the self-scan
          APPSEC_AUTO_FIX_MODE: "4"         # scan only
          APPSEC_CODE_QUALITY: "true"
          APPSEC_DEBUG: "false"
          # AI deep scan disabled: rule-based scanners only, no API keys,
          # no spend. Run AI scans locally when wanted.
          APPSEC_AI_SCAN: "false"
        run: python -m appsec_galaxy.main

      - name: Collect SARIF
        id: sarif
        if: always()
        # Outputs are repo-namespaced (outputs/<repo>/report.sarif); resolve
        # to a fixed path so the upload step has a deterministic input.
        run: |
          f=$(ls outputs/*/report.sarif outputs/report.sarif 2>/dev/null | head -1 || true)
          if [ -n "$f" ]; then
            cp "$f" appsec-galaxy.sarif
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF to Code Scanning
        if: always() && steps.sarif.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: appsec-galaxy.sarif
          category: appsec-galaxy

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: appsec-galaxy-self-scan-outputs
          path: |
            outputs/
            !outputs/**/raw/gitleaks.json
          retention-days: 30

      - name: Fail on critical findings
        run: python scripts/fail_on_critical.py
