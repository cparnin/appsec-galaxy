name: Tests

# Runs the AppSec Galaxy quality gates on every push and pull request.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: pip install -e ".[web,dev]"

      - name: Ruff (blocking)
        run: ruff check src/ mcp/ scripts/ tests/

      - name: Mypy (blocking)
        run: mypy src/appsec_galaxy mcp scripts tests

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: Show environment
        run: |
          python --version
          pip show pytest | grep -E "Name|Version"

      - name: Run pytest
        env:
          # Unit tests never make live model calls.
          APPSEC_AI_SCAN: "false"
          APPSEC_DEBUG: "false"
        run: |
          pytest tests/ -v --tb=short

      - name: Upload coverage (optional)
        if: always()
        run: |
          echo "Tests complete. Add --cov=src for coverage reports once configured."
